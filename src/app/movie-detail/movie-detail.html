@if (movie(); as selectedMovie) {
  <h1 appHighlight="lightgreen">{{ selectedMovie.title }}</h1>

  <p>Year: {{ selectedMovie.year }}</p>
  <p>Genre: {{ selectedMovie.genre }}</p>
  <p>Directors: {{ selectedMovie.directors }}</p>
  <p>Cast: {{ selectedMovie.cast }}</p>
  <p>Rating: {{ selectedMovie.rating }}</p>

  <img [src]="selectedMovie.image"
       [alt]="selectedMovie.title"
       width="200">

  <br>

  <button type="button" (click)="toggleSaved(selectedMovie.id)">
    @if (isSaved(selectedMovie.id)) {
      Unsave Movie
    } @else {
      Save Movie
    }
  </button>

} @else {
  <p>Movie not found.</p>
}
